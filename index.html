<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人自我介绍</title>
    <style>
        /* 引入图标库 */
        @import url("https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css");

        :root {
            --bg-color: rgba(36, 63, 52, 0.85);      
            --title-color: #152b22;
            --card-bg: #ffffff;
            --text-color: #444444;
            --tag-bg: #f0f3f7;
        }
        .dark {
            --bg-color: rgba(18, 32, 26, 0.88);
            --title-color: #78a892;
            --card-bg: #1e332a;
            --text-color: #c9d9d1;
            --tag-bg: #2a4a3d;
        }

        body {
            margin: 0;
            padding-top: 75px;
            padding-left: 15px;
            padding-right: 15px;
            font-family: "Microsoft YaHei", sans-serif;
            background-image: url("https://github.com/yanyi23333/yanyi/blob/main/474589fad0cdb92e3a3e8e8540f2d176.jpg?raw=true");  
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: 0.5s;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
        }

        /* 固定头部：永远一行 */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
            background: var(--bg-color);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: nowrap;
        }
        header h2 {
            color: #FFFFFF;
            font-size: 20px;
            margin: 0;
            white-space: nowrap;
        }

        /* 右侧两个按钮并排 */
        .header-buttons {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        /* 圆形按钮统一样式 */
        .icon-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 50%;
            background: var(--title-color);
            color: white;
            cursor: pointer;
            font-size: 18px;
            position: relative;
        }

        /* 日月切换 */
        .icon-btn .fa-sun-o { display: none; }
        .icon-btn .fa-moon-o { display: block; }
        .dark .icon-btn .fa-moon-o { display: none; }
        .dark .icon-btn .fa-sun-o  { display: block; }

        /* 下拉菜单容器 */
        .dropdown {
            position: relative;
        }
        /* 下拉列表 */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 46px;
            right: 0;
            background: var(--bg-color);
            border-radius: 12px;
            padding: 10px;
            min-width: 130px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            z-index: 999;
        }
        .dropdown-menu a {
            display: block;
            color: #fff;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
        }
        .dropdown-menu a:hover {
            background: rgba(255,255,255,0.15);
        }
        /* 展开状态 */
        .dropdown.open .dropdown-menu {
            display: block;
        }

        /* 普通卡片 */
        .card {
            background: var(--card-bg);
            padding: 26px;
            margin-bottom: 22px;
            border-radius: 14px;
            box-shadow: 0 12px 12px rgba(0,0,0,0.12);
        }

        h1, h3 {
            color: var(--title-color);
        }

        p {
            line-height: 1.7;
        }

        /* ========== 技能标签 完全统一 ========== */
        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 15px;
        }
        .skill-tag {
            background: var(--tag-bg);
            padding: 12px 28px;
            border-radius: 25px;
            font-size: 18px;
            color: var(--text-color);
        }

        /* 联系方式透明底 + 白字 */
        #contact {
            background: transparent !important;
            box-shadow: none !important;
            color: #ffffff;
        }
        #contact h3 {
            color: #ffffff;
            border-color: rgba(255,255,255,0.4) !important;
        }
    </style>
</head>
<body>

<header>
    <h2>yanyi23333</h2>

    <div class="header-buttons">
        <!-- 折叠菜单按钮 -->
        <div class="dropdown">
            <button class="icon-btn" onclick="toggleDropdown()">
                <i class="fa fa-bars"></i>
            </button>
            <div class="dropdown-menu">
                <a href=" ">个人信息</a >
                <a href="#about">关于我</a >
                <a href="#skill">技能栈</a >
                <a href="#contact">联系方式</a >
            </div>
        </div>

        <!-- 明暗切换按钮 -->
        <button class="icon-btn" onclick="toggleMode()">
            <i class="fa fa-moon-o"></i>
            <i class="fa fa-sun-o"></i>
        </button>
    </div>
</header>

<div class="container">
    <div class="card">
        <h1>梁安之</h1>
        <p>大连海事大学 25级机械类</p >
    </div>

    <div id="info" class="card">
        <h3 style="border-bottom: 1px dashed #ccc; padding-bottom: 10px;">快速信息</h3>
        <p>所在地：辽宁 大连</p >
        <p>学校：大连海事大学</p >
        <p>专业：机械类</p >
    </div>

    <div id="about" class="card">
        <h3 style="border-bottom: 1px dashed #ccc; padding-bottom: 10px;">关于我</h3>
        <p>我就读于大连海事大学机械类专业，对计算机知识和前后端开发方面有兴趣，希望能不断在实践中积累经验、提升能力、拓宽视野，掌握更多实用技能。</p >
    </div>

    <div id="skill" class="card">
        <h3 style="border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 10px;">
            技能栈 <span style="float:right; color:var(--text-color); font-weight:normal;"></span>
        </h3>
        <div class="skill-tags">
            <!-- 两个 class 完全一样，样式彻底统一 -->
            <span class="skill-tag">C语言</span>
            <span class="skill-tag">HTML / CSS</span>
        </div>
    </div>

    <div id="contact" class="card">
        <h3 style="border-bottom: 1px dashed #fff; padding-bottom: 10px;">联系方式</h3>
        <p>邮箱：549883070@qq.com</p >
        <p>电话：18002556773</p >
        <p>Github：@yanyi23333</p >
    </div>
</div>

<script>
// 明暗切换
function toggleMode(){
    document.body.classList.toggle("dark");
}
// 展开/收起导航菜单
function toggleDropdown(){
    document.querySelector(".dropdown").classList.toggle("open");
}
// 点页面空白关闭菜单
window.onclick = function(e){
    if(!e.target.matches('.icon-btn, .fa-bars')){
        document.querySelector(".dropdown").classList.remove("open");
    }
}
</script>

</body>
</html>
