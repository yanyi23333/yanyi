<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人自我介绍</title>
    <style>
        /* 引入图标库 */
        @import url("https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css");

        :root {
            --bg-color: rgba(36, 63, 52, 0.85);      
            --title-color: #152b22;
            --card-bg: #ffffff;
            --text-color: #444444;
            --tag-bg: #f0f3f7;
        }
        .dark {
            --bg-color: rgba(18, 32, 26, 0.88);
            --title-color: #78a892;
            --card-bg: #1e332a;
            --text-color: #c9d9d1;
            --tag-bg: #2a4a3d;
        }

        body {
            margin: 0;
            padding-top: 90px;
            padding-left: 15px;
            padding-right: 15px;
            font-family: "Microsoft YaHei", sans-serif;
            background-image: url("474589fad0cdb92e3a3e8e8540f2d176.jpg");  
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: 0.5s;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
        }

        /* 固定页头布局 */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
            background: var(--bg-color);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            /* 左：名字 + 导航整体偏左  右：按钮 */
            justify-content: flex-start;
            gap: 30px;
            flex-wrap: wrap;
        }
        header h2 {
            color: #FFFFFF;
            font-size: 22px;
            margin: 0;
        }

        /* 导航：四个标签 等间距 */
        .nav-tags {
            display: flex;
            gap: 26px; /* 完全等间隔 */
        }
        .nav-tags a {
            padding: 5px 12px;
            background: rgba(255,255,255,0.15);
            color: #fff;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
        }
        .nav-tags a:hover {
            background: rgba(255,255,255,0.3);
        }

        /* 切换按钮靠右顶死 */
        header button {
            margin-left: auto;
        }

        /* 日月图标切换 */
        button {
            padding: 6px 14px;
            border: none;
            border-radius: 20px;
            background: var(--title-color);
            color: white;
            cursor: pointer;
            font-size: 16px;
        }
        .dark button .fa-moon-o {
            display: none;
        }
        .dark button .fa-sun-o {
            display: inline;
        }
        button .fa-sun-o {
            display: none;
        }
        button .fa-moon-o {
            display: none;
        }

        /* 普通卡片 */
        .card {
            background: var(--card-bg);
            padding: 26px;
            margin-bottom: 22px;
            border-radius: 14px;
            box-shadow: 0 12px 12px rgba(0,0,0,0.12);
        }

        h1, h3 {
            color: var(--title-color);
        }

        p {
            line-height: 1.7;
        }

        /* 技能标签 */
        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 15px;
        }
        .skill-tag {
            background: var(--tag-bg);
            padding: 12px 28px;
            border-radius: 25px;
            font-size: 18px;
            color: var(--text-color);
        }

        /* 联系方式透明底 + 白字 */
        #contact {
            background: transparent !important;
            box-shadow: none !important;
            color: #ffffff;
        }
        #contact h3 {
            color: #ffffff;
            border-color: rgba(255,255,255,0.4) !important;
        }
    </style>
</head>
<body>

<header>
    <h2>yanyi23333</h2>
    <!-- 四个标签 等间距、整体偏左 -->
    <div class="nav-tags">
        <a href=" ">个人信息</a >
        <a href="#about">关于我</a >
        <a href="#skill">技能栈</a >
        <a href="#contact">联系方式</a >
    </div>
    <button onclick="toggleMode()">
        <i class="fa fa-moon-o"></i>
        <i class="fa fa-sun-o"></i>
    </button>
</header>

<div class="container">
    <div class="card">
        <h1>梁安之</h1>
        <h1>梁安之</h1>
        <p>大连海事大学 25级机械类</p >
    </div>

    <div id="info" class="card">
        <h3 style="border-bottom: 1px dashed #ccc; padding-bottom: 10px;">快速信息</h3>
        <p>所在地：辽宁 大连</p >
        <p>学校：大连海事大学</p >
        <p>专业：机械类</p >
    </div>

    <div id="about" class="card">
        <h3 style="border-bottom: 1px dashed #ccc; padding-bottom: 10px;">关于我</h3>
        <p>我就读于大连海事大学机械类专业，对计算机知识和前后端开发方面有兴趣，希望能不断在实践中积累经验、提升能力、拓宽视野，掌握更多实用技能。</p >
    </div>

    <div id="skill" class="card">
        <h3 style="border-bottom: 10px solid rgba(0,0,0,0.05); padding-bottom: 10px;">
            技能栈 <span style="float:right; color:var(--text-color); font-weight:normal;"></span>
        </h3>
        <div class="skill-tags">
            <span class="skill-tag">C++</span>
            <span class="skill-tag">HTML / CSS</span>
        </div>
    </div>

    <div id="contact" class="card">
        <h3 style="border-bottom: 1px dashed #fff; padding-bottom: 10px;">联系方式</h3>
        <p>邮箱：549883070@qq.com</p >
        <p>电话：18002556773</p >
        <p>Github：@yanyi23333</p >
    </div>
</div>

<script>
function toggleMode(){
    document.body.classList.toggle("dark");
}
</script>

</body>
</html>
